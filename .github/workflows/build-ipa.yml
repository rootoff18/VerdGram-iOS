name: Build VerdGram iOS IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false
      - name: Fix relative submodule URLs
        run: |
          sed -i '' -E 's#url[ ]*=[ ]*\.\./(.*)#url = https://github.com/TelegramMessenger/\1#' .gitmodules
          git submodule sync --recursive
      - name: Checkout submodules
        run: git submodule update --init --recursive --depth 1 --jobs 8
      - name: Select Xcode
        run: |
          set -euo pipefail
          XV="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          DD="/Applications/Xcode_${XV}.app/Contents/Developer"
          if [ ! -d "$DD" ]; then
            C="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
            DD="${C}/Contents/Developer"
          fi
          sudo xcode-select -s "$DD"
          xcodebuild -version
      - name: Prepare Metal toolchain
        run: |
          if ! xcrun -f metal >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -f metal
      - name: Cache Bazel
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.bazel-cache
          key: bazel-verdgram-${{ github.run_id }}
          restore-keys: bazel-verdgram-
      - name: Build IPA
        run: |
          set -euxo pipefail
          BN=$(( $(git rev-list --count HEAD) + $(cat build_number_offset) ))
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="/private/var/tmp/_bazel_runner" \
            --cacheDir="$GITHUB_WORKSPACE/.bazel-cache" \
            build \
            --configurationPath=build-system/verdgram-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BN"
          mkdir -p out
          IPA="$(find -L bazel-bin/Telegram -maxdepth 1 -name Telegram.ipa | head -1)"
          echo "IPA=$IPA"
          test -f "$IPA"
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa
          unzip -q "$IPA" -d /tmp/ipa
          rm -rf /tmp/ipa/Payload/*.app/PlugIns /tmp/ipa/Payload/*.app/Watch
          (cd /tmp/ipa && zip -qry "$GITHUB_WORKSPACE/out/VerdGram.ipa" Payload)
          ls -lh out
      - name: Save Bazel cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.bazel-cache
          key: bazel-verdgram-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: VerdGram-ios-ipa
          path: out/VerdGram.ipa
          retention-days: 14
